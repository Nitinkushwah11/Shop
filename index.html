<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1 id="shopName"></h1><div class="row" style="flex:none">
<button id="langBtn" onclick="setLang(lang==='en'?'hi':'en')"></button>
<button id="ordersBtn" style="display:none" data-i="myOrders" onclick="showOrders()"></button>
<button onclick="openCart()"><span data-i="cart"></span> (<span id="cc">0</span>)</button>
<button id="authBtn" data-i="login" onclick="authBtn()"></button></div></header>
<main><section class="hero"><div><h2 data-i="hero"></h2><p data-i="heroSub"></p></div><span class="emoji">🛍️</span></section>
<input id="q" type="search" name="search" autocomplete="off" data-p="search" oninput="render()"><div id="list" class="grid" style="margin-top:14px"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div></main>
<button class="fab" id="fab" onclick="openCart()">🛒 <span id="fabT"></span></button>

<div class="modal" id="mAuth"><div class="card"><h3 id="aT" data-i="loginT"></h3>
<input id="aName" data-p="fullName" style="display:none" autocomplete="off"><input id="aPhone" data-p="mobile" style="display:none" autocomplete="off">
<input id="aMail" type="email" data-p="email"><input id="aPass" type="password" data-p="password">
<div class="row"><button data-i="continue" onclick="doAuth()"></button><button class="alt" id="aTog" data-i="newAcc" onclick="toggleAuth()"></button></div>
<p id="aErr" class="out"></p><button class="alt" data-i="close" onclick="closeM('mAuth')"></button></div></div>

<div class="modal" id="mCart"><div class="card"><h3 data-i="yourCart"></h3><div id="cartList"></div><h3 id="cartTotal"></h3>
<input id="cName" data-p="name"><input id="cPhone" data-p="mobile"><textarea id="cAddr" data-p="address"></textarea>
<div class="row"><button data-i="placeOrder" onclick="placeOrder()"></button><button class="alt" data-i="close" onclick="closeM('mCart')"></button></div><p id="cErr" class="out"></p></div></div>

<div class="modal" id="mOrd"><div class="card"><h3 data-i="myOrders"></h3><div id="ordList"></div><button class="alt" data-i="close" onclick="closeM('mOrd')"></button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="i18n.js"></script>
<script>
let products=[],user=null,profile=null,cart=JSON.parse(localStorage.cart||"{}"),signup=false;
const openM=id=>$("#"+id).classList.add("on"),closeM=id=>$("#"+id).classList.remove("on"),isOn=id=>$("#"+id).classList.contains("on");
function rerender(){render();if(isOn("mCart"))openCart();if(isOn("mOrd"))showOrders()}
async function init(){
 $("#shopName").textContent="🛒 "+SHOP_NAME;document.title=SHOP_NAME;
 const {data:{session}}=await sb.auth.getSession();user=session?.user||null;
 if(user)profile=(await sb.from("profiles").select("*").eq("id",user.id).single()).data;
 $("#authBtn").dataset.i=user?"logout":"login";$("#ordersBtn").style.display=user?"":"none";
 if(profile&&profile.role!=="customer")$("#authBtn").insertAdjacentHTML("beforebegin",'<a class="btn" data-i="dashboard" style="background:#fff;color:#0f766e" href="dashboard.html"></a>');
 products=(await sb.from("products").select("*").eq("active",true).order("created_at",{ascending:false})).data||[];
 render();cc();applyLang();
}
let firstR=true;
function render(){
 const q=$("#q").value.toLowerCase();
 $("#list").innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map((p,i)=>{const n=cart[p.id]||0;
  const tag=p.stock<=0?`<span class="tag red">${t("outStock")}</span>`:p.stock<=5?`<span class="tag">${t("low").replace("{n}",p.stock)}</span>`:"";
  const act=p.stock<=0?"":n?`<div class="step"><button onclick="step('${p.id}',-1)">−</button><b>${n}</b><button onclick="step('${p.id}',1)">+</button></div>`:`<button class="full" onclick="add('${p.id}')">${t("addCart")}</button>`;
  return `<div class="card pcard ${firstR?"in":""}" style="animation-delay:${i*45}ms">${tag}<img src="${p.image_url||""}" alt=""><div class="pi"><b>${p.name}</b><div class="price">${money(p.price)} <small>/ ${p.unit}</small></div>${act}</div></div>`}).join("")||`<p>${t("noItems")}</p>`;
 firstR=false;
}
const save=()=>{localStorage.cart=JSON.stringify(cart);cc()};
const cc=()=>{const n=Object.values(cart).reduce((a,b)=>a+b,0),e=$("#cc");e.textContent=n;e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump");
 const tot=Object.entries(cart).reduce((s,[id,q])=>{const p=products.find(x=>x.id===id);return s+(p?p.price*q:0)},0);
 $("#fab").style.display=n?"flex":"none";$("#fabT").textContent=n+" • "+money(tot)};
function step(id,d){const p=products.find(x=>x.id===id);cart[id]=Math.min(Math.max((cart[id]||0)+d,0),p.stock);if(!cart[id])delete cart[id];save();render()}
function add(id){step(id,1);toast("✓ "+t("added"))}
function openCart(){
 let tot=0;const ids=Object.keys(cart).filter(id=>products.find(p=>p.id===id));
 $("#cartList").innerHTML=ids.map(id=>{const p=products.find(x=>x.id===id);tot+=p.price*cart[id];
  return `<div class="row"><span>${p.name}</span><span>${money(p.price)}</span><span><button class="alt" onclick="chg('${id}',-1)">−</button> ${cart[id]} <button class="alt" onclick="chg('${id}',1)">+</button></span></div>`}).join("")||`<p>${t("cartEmpty")}</p>`;
 $("#cartTotal").textContent=t("total")+": "+money(tot);
 if(profile){$("#cName").value=$("#cName").value||profile.full_name||"";$("#cPhone").value=$("#cPhone").value||profile.phone||""}
 openM("mCart");
}
function chg(id,d){const p=products.find(x=>x.id===id);cart[id]=Math.min(Math.max((cart[id]||0)+d,0),p.stock);if(!cart[id])delete cart[id];save();openCart()}
async function placeOrder(){
 if(!user){closeM("mCart");return openM("mAuth")}
 const items=Object.entries(cart).map(([id,qty])=>({id,qty}));if(!items.length)return;
 if(!$("#cName").value||!$("#cPhone").value||!$("#cAddr").value){$("#cErr").textContent=t("fillAll");return}
 const {error}=await sb.rpc("place_order",{p_name:$("#cName").value,p_phone:$("#cPhone").value,p_address:$("#cAddr").value,p_items:items});
 if(error){$("#cErr").textContent=error.message;return}
 cart={};save();closeM("mCart");toast("🎉 "+t("orderDone"),4000);init();
}
function authBtn(){if(user){sb.auth.signOut().then(()=>location.reload())}else openM("mAuth")}
function toggleAuth(){signup=!signup;$("#aT").dataset.i=signup?"signupT":"loginT";$("#aTog").dataset.i=signup?"haveAcc":"newAcc";
 $("#aName").style.display=$("#aPhone").style.display=signup?"":"none";applyLang()}
async function doAuth(){
 const email=$("#aMail").value,password=$("#aPass").value;let r;
 if(signup)r=await sb.auth.signUp({email,password,options:{data:{full_name:$("#aName").value,phone:$("#aPhone").value}}});
 else r=await sb.auth.signInWithPassword({email,password});
 if(r.error)return $("#aErr").textContent=r.error.message;
 location.reload();
}
async function showOrders(){
 const {data}=await sb.from("orders").select("*,order_items(*)").order("created_at",{ascending:false});
 $("#ordList").innerHTML=(data||[]).map(o=>`<div class="card"><b>${t("order")} #${o.id}</b> <span class="badge">${t("st_"+o.status)}</span><div class="muted">${new Date(o.created_at).toLocaleString()}</div>
 ${o.order_items.map(i=>`<div>${i.name} × ${i.qty} = ${money(i.price*i.qty)}</div>`).join("")}<b>${t("total")} ${money(o.total)}</b></div>`).join("")||`<p>${t("noOrders")}</p>`;
 openM("mOrd");
}
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove("on")});
applyLang();init();
</script></body></html>
